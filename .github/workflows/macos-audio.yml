name: macOS audio backend
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Compile Core Audio helper from source
        run: >-
          clang -dynamiclib -O3 -fobjc-arc -arch arm64
          -mmacosx-version-min=14.2 -framework Foundation -framework CoreAudio
          wune/tap_backend.m -o wune/libwune_tap.dylib
      - name: Test capture routing and lifecycle without audio permissions
        run: |
          python -m unittest discover -s tests -p 'test_capture*.py'
          python -m unittest discover -s tests -p 'test_tap_macos.py'

      - name: Test macOS settings process and window integration
        run: |
          python -m unittest discover -s tests -p 'test_macos_windows.py'
          python -m unittest discover -s tests -p 'test_settings_dialog.py'
          python -m unittest discover -s tests -p 'test_settings.py'
      - name: Test smart idle and interaction wakeup
        run: python -m unittest discover -s tests -p 'test_smart_idle.py'
